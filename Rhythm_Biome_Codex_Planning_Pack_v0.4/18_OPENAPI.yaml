openapi: 3.1.0
info:
  title: Rhythm Biome API — core starter
  version: 0.3.0
  description: Design-time core contracts. Not deployed; complete remaining routes and nested schemas before implementing
    each slice. All money integer paise. Use Supabase Auth for sign-in; domain access via API.
servers:
- url: http://localhost:3001
  description: Local development placeholder
x-contract-status:
  status: starter
  remaining:
  - Full admin CRUD / publishing, refunds and settlement, inventory, clinical import/review, support, preferences,
    routine edits, metric detail, future feature endpoints
  - Exact per-component JSON schemas, conditional expressions, sync operation discriminated union, provider signature
    headers and error schemas
  - Validate against approved clinical protocols and real gateway/courier sandbox before release
security:
- bearerAuth: []
