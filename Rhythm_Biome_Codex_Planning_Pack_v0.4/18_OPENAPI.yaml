components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
          - request_id
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Ack:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        revision:
          type: integer
          minimum: 1
      required:
      - id
      - status
      additionalProperties: false
    Profile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          anyOf:
          - type: string
          - type: 'null'
        timezone:
          type: string
        locale:
          type: string
        onboarding_state:
          type: string
        revision:
          type: integer
          minimum: 1
      required:
      - user_id
      - display_name
      - timezone
      - locale
      - onboarding_state
      - revision
      additionalProperties: false
    ProfilePatch:
      type: object
      minProperties: 2
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
        timezone:
          type: string
        locale:
          type: string
        base_revision:
          type: integer
          minimum: 1
      required:
      - base_revision
      additionalProperties: false
    AddressInput:
      type: object
      properties:
        label:
          type: string
        recipient_name:
          type: string
        phone:
          type: string
        line1:
          type: string
        line2:
          type: string
        landmark:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
          pattern: ^[1-9][0-9]{5}$
        country:
          const: IN
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        location_source:
          type: string
          enum:
          - manual
          - gps
          - search
          - pin
      required:
      - label
      - recipient_name
      - phone
      - line1
      - city
      - state
      - postal_code
      - country
      additionalProperties: false
    Address:
      allOf:
      - type: object
        properties:
          label:
            type: string
          recipient_name:
            type: string
          phone:
            type: string
          line1:
            type: string
          line2:
            type: string
          landmark:
            type: string
          city:
            type: string
          state:
            type: string
          postal_code:
            type: string
            pattern: ^[1-9][0-9]{5}$
          country:
            const: IN
          lat:
            type: number
            minimum: -90
            maximum: 90
          lng:
            type: number
            minimum: -180
            maximum: 180
          location_source:
            type: string
            enum:
            - manual
            - gps
            - search
            - pin
        required:
        - label
        - recipient_name
        - phone
        - line1
        - city
        - state
        - postal_code
        - country
      - type: object
        properties:
          id:
            type: string
            format: uuid
          revision:
            type: integer
            minimum: 1
        required:
        - id
        - revision
      unevaluatedProperties: false
    FeatureConfig:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        min_build:
          type: integer
          minimum: 1
        features:
          type: object
          additionalProperties:
            type: boolean
        component_capabilities:
          type: array
          items:
            type: string
      required:
      - version
      - min_build
      - features
      - component_capabilities
      additionalProperties: false
    Component:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        schema_version:
          type: integer
          minimum: 1
        props:
          type: object
          additionalProperties: true
      required:
      - id
      - type
      - schema_version
      - props
      additionalProperties: false
    Layout:
      type: object
      properties:
        key:
          type: string
        version:
          type: integer
          minimum: 1
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
      required:
      - key
      - version
      - components
      additionalProperties: false
    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        alt_text:
          type: string
      required:
      - id
      - url
      - width
      - height
      - alt_text
      additionalProperties: false
    Sku:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku_code:
          type: string
        format:
          type: string
        size_label:
          type: string
        price_paise:
          type: integer
          minimum: 0
          format: int64
        currency:
          const: INR
        available:
          type: boolean
      required:
      - id
      - sku_code
      - format
      - size_label
      - price_paise
      - currency
      - available
      additionalProperties: false
    Product:
      type: object
      properties:
        id:
